name: Deploy to Production

on:
  push:
    branches:
      - main  # Jalankan setiap kali ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Langkah di bawah ini adalah contoh jika menggunakan FTP/SFTP
      # Anda perlu mengatur 'Secrets' di Settings Repository GitHub Anda
      # agar username/password server tidak terlihat oleh publik.
      
